<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lift Log</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f6f4a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift·Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --iron:#1c1e1f;--iron-2:#242628;--iron-3:#2d3033;
    --chalk:#f4f0e6;--chalk-dim:#9a968b;
    --rust:#c1502e;--rust-d:#8f3a20;--rust-lt:#dd6d45;
    --brass:#b8863a;--brass-d:#8a6527;
    --line:#37393c;--danger:#c1502e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--iron);color:var(--chalk);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:contain;}
  body{max-width:480px;margin:0 auto;padding-bottom:calc(220px + env(safe-area-inset-bottom));min-height:100vh;}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  button,input{touch-action:manipulation;}
  button{-webkit-user-select:none;user-select:none;}

  header{position:sticky;top:0;z-index:20;background:var(--iron);padding:calc(18px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line);box-shadow:0 0 0 rgba(0,0,0,0);transition:box-shadow .2s ease;}
  header.scrolled{box-shadow:0 8px 20px -10px rgba(0,0,0,.5);}
  .brand{display:flex;align-items:flex-start;justify-content:space-between;}
  .mark{font-family:'Oswald';font-weight:700;font-size:22px;letter-spacing:.01em;color:var(--chalk);text-transform:uppercase;}
  .mark span{color:var(--rust);}
  .brand-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .sub{font-size:10.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.09em;font-weight:600;}
  .streak{display:none;align-items:center;gap:5px;background:rgba(184,134,58,.14);border:1px solid rgba(184,134,58,.4);border-radius:99px;padding:3px 10px 3px 8px;}
  .streak svg{width:12px;height:12px;fill:var(--brass);}
  .streak span{font-family:'JetBrains Mono';font-weight:700;font-size:11.5px;color:var(--brass);font-variant-numeric:tabular-nums;}

  .daterow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px;}
  .date{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--chalk-dim);}
  .shift{display:inline-flex;background:var(--iron-2);border:1px solid var(--line);border-radius:99px;padding:3px;}
  .shift button{border:0;background:transparent;font-family:'Inter';font-weight:600;font-size:12px;color:var(--chalk-dim);padding:13px 16px;min-height:44px;border-radius:99px;cursor:pointer;transition:background .15s,color .15s,transform .1s;}
  .shift button.on{background:var(--rust);color:var(--chalk);}
  .shift button:active{transform:scale(.94);}

  main{padding:16px 14px 0;}
  @keyframes viewFade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
  main.anim{animation:viewFade .22s ease-out;}
  @media (prefers-reduced-motion:reduce){main.anim{animation:none;}}

  .rest-timer{background:var(--iron-2);border:1px solid var(--rust);border-radius:14px;padding:14px;margin-bottom:14px;}
  .rt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .rt-label{font-family:'Oswald';font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--rust-lt);}
  .rt-time{font-family:'JetBrains Mono';font-weight:700;font-size:22px;color:var(--chalk);font-variant-numeric:tabular-nums;}
  .rt-bar{height:6px;border-radius:99px;background:var(--iron);overflow:hidden;margin-bottom:11px;}
  .rt-fill{height:100%;background:linear-gradient(90deg,var(--rust),var(--rust-lt));border-radius:99px;transition:width 1s linear;}
  .rt-actions{display:flex;gap:8px;}
  .rt-actions button{flex:1;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--iron);color:var(--chalk-dim);font-family:'Oswald';font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;transition:transform .1s;-webkit-user-select:none;user-select:none;}
  .rt-actions button:active{transform:scale(.95);}
  .rt-actions #rtSkip{flex:1.5;background:var(--rust);border-color:var(--rust);color:var(--chalk);}

  .rest-banner{display:flex;align-items:center;gap:10px;background:rgba(184,134,58,.12);border:1px solid rgba(184,134,58,.35);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;color:var(--brass);line-height:1.4;}
  .rest-banner svg{width:18px;height:18px;fill:var(--brass);flex-shrink:0;}

  .ex{background:var(--iron-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .ex.done{border-color:rgba(193,80,46,.5);background:linear-gradient(155deg,var(--iron-2),rgba(193,80,46,.08));}
  .ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .ex-name{font-family:'Oswald';font-weight:600;font-size:16.5px;letter-spacing:.01em;line-height:1.2;text-transform:uppercase;color:var(--chalk);background:none;border:0;padding:0;text-align:left;cursor:pointer;-webkit-user-select:none;user-select:none;}
  .ex-name:active{opacity:.7;}
  .ex-meta{font-size:11.5px;color:var(--chalk-dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;font-family:'JetBrains Mono';}
  .ex-idx{font-family:'Oswald';font-weight:700;font-size:13px;color:var(--chalk);background:var(--rust);min-width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(-2deg);}
  .ex.done .ex-idx{background:var(--brass);color:var(--iron);}
  @keyframes clank{0%{transform:scale(1) rotate(-2deg);}35%{transform:scale(1.32) rotate(-2deg);box-shadow:0 0 0 9px rgba(184,134,58,.3);}100%{transform:scale(1) rotate(-2deg);box-shadow:0 0 0 0 rgba(184,134,58,0);}}
  .ex-idx.clank{animation:clank .5s cubic-bezier(.3,1.5,.5,1);}
  @media (prefers-reduced-motion:reduce){.ex-idx.clank{animation:none;}}

  .wt{display:flex;align-items:center;gap:8px;margin:13px 0 14px;flex-wrap:wrap;}
  .wt label{font-size:10.5px;font-weight:600;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;}
  .wt .field{position:relative;width:104px;}
  .wt input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--iron);font-family:'JetBrains Mono';font-weight:600;font-size:16px;color:var(--rust-lt);text-align:center;padding:0 30px 0 8px;font-variant-numeric:tabular-nums;outline:none;transition:.12s;box-shadow:inset 0 2px 5px rgba(0,0,0,.45);}
  .wt input:focus{border-color:var(--rust);box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 0 0 3px rgba(193,80,46,.18);}
  .wt input::placeholder{color:var(--chalk-dim);opacity:.5;}
  .wt .unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:600;color:var(--chalk-dim);pointer-events:none;}
  .wt .pr{display:none;align-items:center;font-family:'Oswald';font-weight:600;font-size:10px;letter-spacing:.04em;color:var(--iron);background:var(--brass);padding:3px 7px;border-radius:5px;transform:rotate(-2deg);}
  .plate-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--iron);color:var(--chalk-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s,color .12s,border-color .12s;}
  .plate-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;}
  .plate-btn.on{color:var(--rust);border-color:var(--rust);}
  .plate-btn:active{transform:scale(.9);}
  .plate-out{display:none;font-family:'JetBrains Mono';font-size:11.5px;line-height:1.5;color:var(--chalk-dim);background:var(--iron);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:-3px 0 12px;}
  .plate-out.show{display:block;}
  .plate-out b{color:var(--rust-lt);}
  .wt .prog{margin-left:auto;font-family:'JetBrains Mono';font-weight:700;font-size:13px;color:var(--chalk-dim);font-variant-numeric:tabular-nums;}

  .ticks{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:9px;}
  .tick{position:relative;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle at 33% 28%,var(--iron-3),var(--iron-2) 62%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;transition:transform .1s,background .12s,border-color .12s,box-shadow .12s;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  .tick:active{transform:scale(.92);}
  .tick .n{font-size:8.5px;font-weight:600;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.03em;}
  .tick .r{font-family:'JetBrains Mono';font-weight:700;font-size:15px;color:var(--chalk-dim);font-variant-numeric:tabular-nums;}
  .tick.on{background:radial-gradient(circle at 33% 28%,var(--rust-lt),var(--rust) 55%,var(--rust-d) 100%);border-color:var(--rust-d);box-shadow:inset 0 -3px 5px rgba(0,0,0,.3),0 0 0 4px rgba(193,80,46,.16);}
  .tick.on .n{color:rgba(244,240,230,.7);}
  .tick.on .r{color:var(--chalk);}

  .savebar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;padding:10px 14px 12px;background:linear-gradient(to top,var(--iron) 74%,transparent);}
  .note-input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--iron-2);font-family:'Inter';font-size:16px;color:var(--chalk);padding:0 12px;outline:none;margin-bottom:9px;transition:border-color .12s;}
  .note-input:focus{border-color:var(--rust);}
  .note-input::placeholder{color:var(--chalk-dim);}
  .save{width:100%;height:52px;border:0;border-radius:12px;background:var(--rust);color:var(--chalk);font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,background .15s;-webkit-user-select:none;user-select:none;}
  .save:active{transform:scale(.97);}
  .save.done{background:var(--brass);color:var(--iron);}
  .save-sub{text-align:center;font-size:11px;color:var(--chalk-dim);margin-top:7px;font-weight:500;font-family:'JetBrains Mono';}

  .tabs{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--iron-2);border-top:1px solid var(--line);display:flex;z-index:25;}
  .tabs button{flex:1;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Inter';font-weight:600;font-size:11px;color:var(--chalk-dim);-webkit-user-select:none;user-select:none;transition:transform .1s,color .15s;}
  .tabs button.on{color:var(--rust);}
  .tabs button:active{transform:scale(.93);}
  .tabs svg{width:22px;height:22px;stroke-width:2;fill:none;stroke:currentColor;transition:transform .18s cubic-bezier(.34,1.56,.64,1);}
  .tabs button.on svg{transform:translateY(-1px) scale(1.08);}

  h2.view-title{font-family:'Oswald';font-weight:600;font-size:20px;letter-spacing:.01em;text-transform:uppercase;color:var(--chalk);padding:2px 4px 4px;}
  .view-note{font-size:12px;color:var(--chalk-dim);padding:0 4px 14px;line-height:1.45;}

  .tonnage{background:var(--iron-2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;text-align:center;}
  .tonnage-label{font-size:10.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:4px;}
  .tonnage-num{font-family:'JetBrains Mono';font-weight:700;font-size:34px;color:var(--rust-lt);letter-spacing:.01em;font-variant-numeric:tabular-nums;}
  .tonnage-unit{font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;font-weight:600;}

  .cal-wrap{background:var(--iron-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-title{font-family:'Oswald';font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--chalk);}
  .cal-nav{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--iron);color:var(--chalk-dim);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s;-webkit-user-select:none;user-select:none;}
  .cal-nav:active{transform:scale(.9);}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .cal-dow span{text-align:center;font-size:9.5px;font-weight:600;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.04em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;background:transparent;border:1px solid transparent;color:var(--chalk-dim);}
  .cal-cell.blank{visibility:hidden;}
  .cal-cell.hit{background:var(--rust);border-color:var(--rust);color:var(--chalk);}
  .cal-cell.bonus{background:var(--brass);border-color:var(--brass);color:var(--iron);}
  .cal-cell.missed{background:rgba(193,80,46,.14);border:1.5px solid var(--rust-d);color:var(--rust-lt);}
  .cal-cell.rest-ok{background:var(--iron-3);color:var(--chalk-dim);}
  .cal-cell.future-work{border:1.5px dashed var(--rust);color:var(--rust-lt);}
  .cal-summary{text-align:center;font-size:11px;color:var(--chalk-dim);font-family:'JetBrains Mono';margin-top:10px;font-weight:600;}
  .cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
  .cal-leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--chalk-dim);font-weight:600;}
  .cal-dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0;}
  .cal-dot.hit{background:var(--rust);}
  .cal-dot.bonus{background:var(--brass);}
  .cal-dot.rest-ok{background:var(--iron-3);border:1px solid var(--line);}
  .cal-dot.missed{background:rgba(193,80,46,.14);border:1.5px solid var(--rust-d);}

  .cycle-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--iron-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:12px;color:var(--chalk-dim);line-height:1.4;}
  .cycle-cta button{flex-shrink:0;height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--rust);color:var(--chalk);font-family:'Oswald';font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;transition:transform .1s;}
  .cycle-cta button:active{transform:scale(.95);}
  .cycle-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:12px;color:var(--chalk-dim);font-family:'JetBrains Mono';}
  .cycle-form{margin-bottom:14px;}

  .body-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .body-stat{background:var(--iron-2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .body-stat .n{font-family:'JetBrains Mono';font-weight:700;font-size:26px;color:var(--rust-lt);}
  .body-stat .n .u{font-size:12px;color:var(--chalk-dim);margin-left:3px;font-weight:600;}
  .body-stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);margin-top:3px;font-weight:600;}
  .body-stat .d{font-size:10.5px;color:var(--brass);margin-top:4px;font-family:'JetBrains Mono';font-weight:600;}
  .spark-wrap{background:var(--iron-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .spark-label{font-size:10.5px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px;}
  .spark-svg{width:100%;height:50px;display:block;}

  .backup-wrap{background:var(--iron-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:6px;}
  .backup-label{font-family:'Oswald';font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--chalk);margin-bottom:6px;}
  .backup-note{font-size:11.5px;color:var(--chalk-dim);line-height:1.5;margin-bottom:12px;}
  .backup-actions{display:flex;gap:9px;}
  .backup-actions button{flex:1;height:44px;border-radius:9px;font-family:'Oswald';font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;border:1px solid var(--line);background:var(--iron);color:var(--chalk-dim);transition:transform .1s;-webkit-user-select:none;user-select:none;}
  .backup-actions button:active{transform:scale(.96);}
  .backup-actions #exportBtn{background:var(--rust);border-color:var(--rust);color:var(--chalk);}

  .plan-ex{background:var(--iron-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
  .plan-ex .pn{flex:1;min-width:0;}
  .plan-ex .pname{font-family:'Oswald';font-weight:600;font-size:15px;line-height:1.2;text-transform:uppercase;color:var(--chalk);}
  .plan-ex .pmeta{font-size:12px;color:var(--chalk-dim);margin-top:2px;font-weight:500;font-family:'JetBrains Mono';}
  .icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--iron);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--chalk-dim);flex-shrink:0;transition:transform .1s,color .12s,border-color .12s;}
  .icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;}
  .icon-btn.del{color:var(--rust-lt);border-color:rgba(193,80,46,.35);background:rgba(193,80,46,.08);}
  .icon-btn:active{transform:scale(.9);}
  .add-btn{width:100%;height:50px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--brass);font-family:'Oswald';font-weight:600;font-size:14px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:10px;transition:transform .1s;-webkit-user-select:none;user-select:none;}
  .add-btn:active{transform:scale(.98);}

  .form{background:var(--iron-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .form h3{font-family:'Oswald';font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--chalk);margin-bottom:12px;}
  .frow{margin-bottom:11px;}
  .frow label{display:block;font-size:10.5px;font-weight:600;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  .frow input{width:100%;height:46px;border:1px solid var(--line);border-radius:9px;background:var(--iron);font-family:'Inter';font-weight:500;font-size:16px;color:var(--chalk);padding:0 12px;outline:none;transition:.12s;}
  .frow input:focus{border-color:var(--rust);box-shadow:0 0 0 3px rgba(193,80,46,.18);}
  .frow.num input{font-family:'JetBrains Mono';font-weight:700;text-align:center;font-variant-numeric:tabular-nums;}
  .fgrid{display:flex;gap:10px;}
  .fgrid .frow{flex:1;}
  .fbtns{display:flex;gap:9px;margin-top:4px;}
  .fbtns button{flex:1;height:48px;border-radius:9px;font-family:'Oswald';font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;border:1px solid var(--line);background:var(--iron);color:var(--chalk-dim);transition:transform .1s;-webkit-user-select:none;user-select:none;}
  .fbtns button:active{transform:scale(.97);}
  .fbtns .primary{background:var(--rust);border-color:var(--rust);color:var(--chalk);}

  .hist-day{background:var(--iron-2);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .hist-top{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;}
  .hist-date{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--chalk);}
  .hist-meta{font-size:11.5px;color:var(--chalk-dim);margin-top:2px;font-weight:500;font-family:'JetBrains Mono';}
  .hist-note{font-size:11.5px;color:var(--chalk-dim);margin-top:3px;font-style:italic;line-height:1.4;}
  .hist-top-r{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .share-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--iron);color:var(--chalk-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s,color .12s;}
  .share-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;}
  .share-btn:active{transform:scale(.9);}
  .pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:99px;flex-shrink:0;border:1px solid transparent;}
  .pill.m{background:rgba(184,134,58,.16);color:var(--brass);border-color:rgba(184,134,58,.35);}
  .pill.e{background:rgba(122,150,168,.16);color:#9fc0d2;border-color:rgba(122,150,168,.35);}
  .hist-body{padding:0 15px 12px;display:none;}
  .hist-body.open{display:block;}
  .hrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px;gap:10px;}
  .hrow .hn{font-weight:500;color:var(--chalk);}
  .hrow .hv{font-family:'JetBrains Mono';font-weight:600;color:var(--rust-lt);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}

  .empty{text-align:center;padding:52px 24px;color:var(--chalk-dim);}
  .empty .big{font-family:'Oswald';font-weight:600;font-size:17px;text-transform:uppercase;color:var(--chalk);margin-bottom:6px;}
  .empty p{font-size:13px;line-height:1.5;}

  .toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--iron);font-size:13px;font-weight:700;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .summary-overlay{position:fixed;inset:0;background:rgba(10,10,10,.68);display:none;align-items:center;justify-content:center;z-index:60;padding:24px;}
  .summary-overlay.show{display:flex;}
  .summary-card{position:relative;background:var(--iron-2);border:1px solid var(--line);border-radius:16px;padding:28px 22px 22px;max-width:320px;width:100%;text-align:center;transform:rotate(-1deg);box-shadow:0 24px 60px rgba(0,0,0,.55);}
  .summary-card::before{content:'';position:absolute;top:12px;left:12px;right:12px;bottom:12px;border:1px dashed var(--line);border-radius:9px;pointer-events:none;}
  .summary-kicker{font-family:'Oswald';font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-bottom:6px;}
  .summary-title{font-family:'Oswald';font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.01em;color:var(--chalk);margin-bottom:20px;}
  .summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
  .summary-stat .n{font-family:'JetBrains Mono';font-weight:700;font-size:22px;color:var(--rust-lt);font-variant-numeric:tabular-nums;}
  .summary-stat .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--chalk-dim);margin-top:3px;font-weight:600;}
  .summary-close{width:100%;height:46px;border:0;border-radius:10px;background:var(--rust);color:var(--chalk);font-family:'Oswald';font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:14px;cursor:pointer;}

  .exercise-overlay{position:fixed;inset:0;background:rgba(10,10,10,.68);display:none;align-items:flex-end;justify-content:center;z-index:60;}
  .exercise-overlay.show{display:flex;}
  .exercise-card{position:relative;background:var(--iron-2);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-width:480px;width:100%;max-height:78vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.5);}
  .exercise-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--iron);color:var(--chalk-dim);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .ex-detail-kicker{font-family:'Oswald';font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-bottom:6px;}
  .ex-detail-title{font-family:'Oswald';font-weight:700;font-size:21px;text-transform:uppercase;color:var(--chalk);margin-bottom:16px;padding-right:40px;}
  .ex-detail-empty{font-size:13px;color:var(--chalk-dim);line-height:1.5;}
  .ex-detail-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .ex-detail-stat{background:var(--iron);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .ex-detail-stat .n{font-family:'JetBrains Mono';font-weight:700;font-size:22px;color:var(--rust-lt);}
  .ex-detail-stat .n .u{font-size:11px;color:var(--chalk-dim);margin-left:2px;}
  .ex-detail-stat .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);margin-top:2px;font-weight:600;}
  .ex-detail-list{border-top:1px solid var(--line);margin-top:4px;}
  .ex-detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--chalk-dim);}
  .ex-detail-row span:last-child{color:var(--chalk);font-family:'JetBrains Mono';font-weight:600;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">Lift<span>·</span>Log</div>
    <div class="brand-r">
      <div class="streak" id="streak"><svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c1.5 1 2 3 2 4.5A6.5 6.5 0 016 22a6.5 6.5 0 01-2-12c1 1 1.5 2 1.5 3C6 8 9 6 12 2z"/></svg><span id="streakN">0</span></div>
      <div class="sub">Tap sets as you go</div>
    </div>
  </div>
  <div class="daterow" id="daterow">
    <div class="date" id="dateLabel">—</div>
    <div class="shift" id="shift">
      <button data-s="morning" class="on">Morning</button>
      <button data-s="evening">Evening</button>
    </div>
  </div>
</header>

<main id="main"></main>

<div class="savebar" id="savebar">
  <input type="text" id="workoutNote" class="note-input" placeholder="Add a note — optional" maxlength="140">
  <button class="save" id="saveBtn">Save workout</button>
  <div class="save-sub" id="saveSub"></div>
</div>

<nav class="tabs">
  <button id="tabToday" class="on">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    Today
  </button>
  <button id="tabPlan">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    Plan
  </button>
  <button id="tabHist">
    <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2M3.05 11a9 9 0 116 9.5"/><path d="M3 4v4h4"/></svg>
    History
  </button>
  <button id="tabBody">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="13" r="3"/><path d="M9 8h6"/></svg>
    Body
  </button>
</nav>

<div class="toast" id="toast"></div>

<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-card">
    <div class="summary-kicker">Workout logged</div>
    <div class="summary-title" id="sumTitle">Saved</div>
    <div class="summary-stats">
      <div class="summary-stat"><div class="n" id="sumSets">0/0</div><div class="l">Sets</div></div>
      <div class="summary-stat"><div class="n" id="sumKg">0</div><div class="l">Kg moved</div></div>
      <div class="summary-stat"><div class="n" id="sumMin">–</div><div class="l">Duration</div></div>
      <div class="summary-stat"><div class="n" id="sumStreak">0</div><div class="l">Day streak</div></div>
    </div>
    <button class="summary-close" id="summaryClose" type="button">Back to it</button>
  </div>
</div>

<div class="exercise-overlay" id="exerciseOverlay">
  <div class="exercise-card">
    <button class="exercise-close" id="exerciseClose" type="button" aria-label="Close">&times;</button>
    <div id="exerciseCardBody"></div>
  </div>
</div>

<script>
const PLAN_KEY='liftlog:plan';
const SESS_KEY='liftlog:sessions';
const DAY_KEY='liftlog:draft';
const BODY_KEY='liftlog:body';
const SETTINGS_KEY='liftlog:settings';

const DEFAULT_PLAN=[
  {id:'bench',name:'Flat Machine Bench Press',sets:4,reps:12,weight:''},
  {id:'pullup',name:'Assisted Pull-up',sets:4,reps:12,weight:''},
  {id:'shoulder',name:'Machine Shoulder Press',sets:4,reps:12,weight:''},
  {id:'curl',name:'Dumbbell Curl',sets:4,reps:12,weight:''},
  {id:'tricep',name:'Tricep Press Down',sets:4,reps:12,weight:''},
  {id:'squat',name:'Free Squats',sets:4,reps:12,weight:''},
];

let plan=[], sessions=[], draft=null, bodyLog=[], settings={cycleStart:null,workOn:3,restOn:1};
let shift='morning', view='today', editingId=null, adding=false;
let justCompletedId=null;
let calYear=null, calMonth=null, cycleEditing=false;
let restTimerId=null, restRunning=false, restTotal=90, restSecondsLeft=0;

function haptic(pattern){
  if('vibrate' in navigator){ try{ navigator.vibrate(pattern); }catch(e){} }
}
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
/* Pure-UTC date math so it never drifts a day against todayISO() (which is UTC-based) in UTC+ timezones */
const addDaysISO=(iso,delta)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+delta);return d.toISOString().slice(0,10);};
const dowUTC=iso=>new Date(iso+'T00:00:00Z').getUTCDay();

async function get(k,fb){
  try{
    const raw=localStorage.getItem(k);
    return raw!==null?JSON.parse(raw):fb;
  }catch(e){return fb;}
}
async function set(k,v){
  try{
    if(v===null||v===undefined){localStorage.removeItem(k);return;}
    localStorage.setItem(k,JSON.stringify(v));
  }catch(e){}
}

async function loadAll(){
  plan=await get(PLAN_KEY, DEFAULT_PLAN.map(x=>({...x})));
  sessions=await get(SESS_KEY, []);
  draft=await get(DAY_KEY, null);
  bodyLog=await get(BODY_KEY, []);
  const loadedSettings=await get(SETTINGS_KEY, {});
  settings={cycleStart:null,workOn:3,restOn:1,restTimerSec:90,...loadedSettings};
  if(!draft || draft.date!==todayISO()) draft=null;
}
const savePlan=()=>set(PLAN_KEY,plan);
const saveSessions=()=>set(SESS_KEY,sessions);
const saveDraft=()=>set(DAY_KEY,draft);
const saveBody=()=>set(BODY_KEY,bodyLog);
const saveSettings=()=>set(SETTINGS_KEY,settings);
const daysBetweenISO=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000);

function lastWeightFor(name){
  for(let i=sessions.length-1;i>=0;i--){
    const e=sessions[i].entries.find(e=>e.name===name);
    if(e&&e.weight) return e.weight;
  }
  return '';
}
function maxWeightFor(name){
  let max=null;
  sessions.forEach(s=>{
    const e=s.entries.find(e=>e.name===name);
    if(e&&e.weight){const w=parseFloat(e.weight);if(!isNaN(w)&&(max===null||w>max))max=w;}
  });
  return max;
}
function computeStreak(){
  if(!sessions.length) return 0;
  const dates=[...new Set(sessions.map(s=>s.date))];
  const has=d=>dates.includes(d);
  let cursor=todayISO();
  if(!has(cursor)) cursor=addDaysISO(cursor,-1);
  let count=0;
  while(has(cursor)){
    count++; cursor=addDaysISO(cursor,-1);
  }
  return count;
}
/* Tier colors mirror real bumper-plate weights: 10kg green, 15kg yellow, 20kg blue, 25kg red */
function streakTier(n){
  if(n>=14) return {name:'Elite',color:'#c1502e',bg:'rgba(193,80,46,.16)',border:'rgba(193,80,46,.4)'};
  if(n>=7) return {name:'Strong',color:'#4f8fd1',bg:'rgba(79,143,209,.16)',border:'rgba(79,143,209,.4)'};
  if(n>=3) return {name:'Building',color:'#d4b23c',bg:'rgba(212,178,60,.16)',border:'rgba(212,178,60,.4)'};
  return {name:'Starting',color:'#4a9b6e',bg:'rgba(74,155,110,.16)',border:'rgba(74,155,110,.4)'};
}
function renderStreak(){
  const n=computeStreak();
  const el=document.getElementById('streak');
  const numEl=document.getElementById('streakN');
  numEl.textContent=n;
  if(n>0){
    const t=streakTier(n);
    el.style.display='inline-flex';
    el.style.background=t.bg;
    el.style.borderColor=t.border;
    el.querySelector('svg').style.fill=t.color;
    numEl.style.color=t.color;
    el.title=`${t.name} streak — ${n} day${n===1?'':'s'}`;
  } else {
    el.style.display='none';
  }
}

const BAR_KG=20;
const PLATE_SET=[25,20,15,10,5,2.5,1.25];
function plateBreakdown(totalRaw){
  const target=parseFloat(totalRaw);
  if(isNaN(target)||target<=0) return null;
  let perSide=(target-BAR_KG)/2;
  if(perSide<=0) return {plates:[],remainder:0,barOnly:true};
  const plates=[];
  let remaining=perSide;
  PLATE_SET.forEach(p=>{ while(remaining>=p-0.001){plates.push(p);remaining-=p;} });
  return {plates,remainder:remaining,barOnly:false};
}
const fmtPlate=p=>Number.isInteger(p)?String(p):p.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
function renderPlateOut(id){
  const out=document.getElementById('plateout-'+id);
  if(!out) return;
  const bd=plateBreakdown(draft.weights[id]);
  if(!bd){ out.innerHTML='Enter a weight first.'; return; }
  if(bd.barOnly){ out.innerHTML=`Bar only <b>(${BAR_KG}kg)</b> — target is at or under empty bar weight.`; return; }
  const list=bd.plates.map(fmtPlate).join(' + ');
  out.innerHTML=`<b>${list}</b> kg per side (+ ${BAR_KG}kg bar)${bd.remainder>0.01?` · ${bd.remainder.toFixed(2)}kg left over, no plate that small`:''}`;
}

const fmtMMSS=sec=>`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
function safeRenderToday(){ if(view==='today') renderToday(); }
function updateRestTimerUI(){
  const timeEl=document.getElementById('rtTime'); if(!timeEl) return;
  timeEl.textContent=fmtMMSS(Math.max(0,restSecondsLeft));
  const fill=document.getElementById('rtFill');
  if(fill) fill.style.width=`${Math.max(0,(restSecondsLeft/restTotal)*100)}%`;
}
function startRestTimer(){
  clearInterval(restTimerId);
  restTotal=settings.restTimerSec||90; restSecondsLeft=restTotal; restRunning=true;
  restTimerId=setInterval(()=>{
    restSecondsLeft--;
    if(restSecondsLeft<=0){
      clearInterval(restTimerId); restTimerId=null; restRunning=false;
      haptic([20,60,20,60,40]);
      safeRenderToday();
    } else updateRestTimerUI();
  },1000);
}
function stopRestTimer(shouldRender){
  clearInterval(restTimerId); restTimerId=null; restRunning=false;
  if(shouldRender!==false) safeRenderToday();
}
function adjustRestTimer(delta){
  restTotal=Math.max(15,restTotal+delta);
  restSecondsLeft=Math.max(0,restSecondsLeft+delta);
  updateRestTimerUI();
  settings.restTimerSec=restTotal; saveSettings();
}

function ensureDraft(){
  if(!draft || draft.date!==todayISO()) draft={date:todayISO(),shift,marks:{},weights:{},note:''};
  draft.shift=shift;
  if(draft.note===undefined) draft.note='';
  plan.forEach(ex=>{
    if(!draft.marks[ex.id]) draft.marks[ex.id]=Array.from({length:ex.sets},()=>false);
    else if(draft.marks[ex.id].length!==ex.sets){
      const old=draft.marks[ex.id]; draft.marks[ex.id]=Array.from({length:ex.sets},(_,i)=>old[i]||false);
    }
    if(draft.weights[ex.id]===undefined) draft.weights[ex.id]=lastWeightFor(ex.name)||ex.weight||'';
  });
}
function syncNoteInput(){
  const el=document.getElementById('workoutNote');
  if(el) el.value=(draft&&draft.note)||'';
}

function expectedTypeToday(){
  if(!settings.cycleStart||todayISO()<settings.cycleStart) return null;
  const cycleLen=settings.workOn+settings.restOn;
  const diff=daysBetweenISO(settings.cycleStart,todayISO());
  const pos=((diff%cycleLen)+cycleLen)%cycleLen;
  return pos<settings.workOn?'workout':'rest';
}
function restDayBannerHtml(){
  if(expectedTypeToday()!=='rest') return '';
  const already=sessions.some(s=>s.date===todayISO());
  const msg=already?'Bonus session logged on a rest day — recovery can wait.':"Today's a planned rest day. Anything you log here counts as a bonus.";
  return `<div class="rest-banner"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg><span>${msg}</span></div>`;
}

function showExerciseDetail(name){
  const points=[];
  sessions.forEach(s=>{
    const e=s.entries.find(e=>e.name===name);
    if(e&&e.weight){ const w=parseFloat(e.weight); if(!isNaN(w)) points.push({date:s.date,weight:w,done:e.done,sets:e.sets}); }
  });
  points.sort((a,b)=>a.date.localeCompare(b.date));
  const body=document.getElementById('exerciseCardBody');
  let html=`<div class="ex-detail-kicker">Exercise history</div><div class="ex-detail-title">${name}</div>`;
  if(!points.length){
    html+=`<p class="ex-detail-empty">No weight logged for this exercise yet. Save a workout with a weight to start tracking it here.</p>`;
  } else {
    const max=Math.max(...points.map(p=>p.weight));
    html+=`<div class="ex-detail-stats"><div class="ex-detail-stat"><div class="n">${max}<span class="u">kg</span></div><div class="l">Best</div></div><div class="ex-detail-stat"><div class="n">${points.length}</div><div class="l">Logged</div></div></div>`;
    if(points.length>=2) html+=sparklineSvg(points.slice(-20).map(p=>({weightKg:String(p.weight)})));
    const recent=[...points].reverse().slice(0,8);
    html+=`<div class="ex-detail-list">`+recent.map(p=>`<div class="ex-detail-row"><span>${fmtDate(p.date)}</span><span>${p.weight}kg · ${p.done}/${p.sets} sets</span></div>`).join('')+`</div>`;
  }
  body.innerHTML=html;
  document.getElementById('exerciseOverlay').classList.add('show');
}

function renderToday(){
  ensureDraft();
  const main=document.getElementById('main');
  if(!plan.length){
    main.innerHTML=`<div class="empty"><div class="big">Bar's empty</div><p>Add exercises in Plan, then come back and get to work.</p></div>`;
    document.getElementById('saveSub').textContent=''; return;
  }
  const timerHtml=restRunning?`<div class="rest-timer">
      <div class="rt-head"><span class="rt-label">Rest</span><span class="rt-time" id="rtTime">${fmtMMSS(restSecondsLeft)}</span></div>
      <div class="rt-bar"><div class="rt-fill" id="rtFill" style="width:${Math.max(0,(restSecondsLeft/restTotal)*100)}%"></div></div>
      <div class="rt-actions">
        <button type="button" id="rtMinus">−15s</button>
        <button type="button" id="rtSkip">Skip rest</button>
        <button type="button" id="rtPlus">+15s</button>
      </div>
    </div>`:'';
  main.innerHTML=restDayBannerHtml()+timerHtml+plan.map((ex,i)=>{
    const marks=draft.marks[ex.id];
    const doneCount=marks.filter(Boolean).length;
    const allDone=doneCount===ex.sets;
    const ticks=marks.map((on,si)=>`<div class="tick ${on?'on':''}" data-ex="${ex.id}" data-si="${si}"><span class="n">Set ${si+1}</span><span class="r">${ex.reps}</span></div>`).join('');
    const w=parseFloat(draft.weights[ex.id]);
    const max=maxWeightFor(ex.name);
    const isPR=!isNaN(w)&&max!==null&&w>max;
    return `<div class="ex ${allDone?'done':''}">
      <div class="ex-head">
        <div><button type="button" class="ex-name" data-exname="${ex.name}">${ex.name}</button><div class="ex-meta">${ex.sets} sets × ${ex.reps} reps</div></div>
        <div class="ex-idx${justCompletedId===ex.id?' clank':''}">${allDone?'✓':i+1}</div>
      </div>
      <div class="wt">
        <label>Weight</label>
        <span class="field"><input inputmode="decimal" data-wex="${ex.id}" value="${draft.weights[ex.id]||''}" placeholder="–"><span class="unit">kg</span></span>
        <span class="pr" data-pr="${ex.id}" style="display:${isPR?'inline-flex':'none'}">PR</span>
        <button class="plate-btn" type="button" data-plate="${ex.id}" aria-label="Show plate breakdown"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="3.2"/><circle cx="19" cy="12" r="3.2"/><path d="M8.2 12h7.6"/></svg></button>
        <span class="prog">${doneCount}/${ex.sets}</span>
      </div>
      <div class="plate-out" id="plateout-${ex.id}"></div>
      <div class="ticks">${ticks}</div>
    </div>`;
  }).join('');
  justCompletedId=null;

  main.querySelectorAll('.tick').forEach(t=>t.addEventListener('click',()=>{
    const exId=t.dataset.ex, si=+t.dataset.si;
    const ex=plan.find(p=>p.id===exId);
    const marks=draft.marks[exId];
    const wasAllDone=marks.filter(Boolean).length===ex.sets;
    const turningOn=!marks[si];
    marks[si]=turningOn;
    if(turningOn&&!draft.startedAt) draft.startedAt=Date.now();
    const nowAllDone=marks.filter(Boolean).length===ex.sets;
    if(turningOn&&!wasAllDone&&nowAllDone){ justCompletedId=exId; haptic([12,25,12]); }
    else haptic(8);
    if(turningOn) startRestTimer();
    else if(restRunning) stopRestTimer(false);
    saveDraft(); renderToday();
  }));
  main.querySelectorAll('.ex-name').forEach(b=>b.addEventListener('click',()=>showExerciseDetail(b.dataset.exname)));
  const rtMinus=document.getElementById('rtMinus');
  if(rtMinus)rtMinus.addEventListener('click',()=>{haptic(6);adjustRestTimer(-15);});
  const rtPlus=document.getElementById('rtPlus');
  if(rtPlus)rtPlus.addEventListener('click',()=>{haptic(6);adjustRestTimer(15);});
  const rtSkip=document.getElementById('rtSkip');
  if(rtSkip)rtSkip.addEventListener('click',()=>{haptic(10);stopRestTimer();});
  main.querySelectorAll('input[data-wex]').forEach(inp=>inp.addEventListener('input',()=>{
    const exId=inp.dataset.wex;
    draft.weights[exId]=inp.value.trim(); saveDraft();
    /* keep focus, no full rerender — just refresh this row's PR badge and open plate breakdown */
    const ex=plan.find(p=>p.id===exId);
    const w=parseFloat(inp.value);
    const max=maxWeightFor(ex.name);
    const badge=inp.closest('.wt').querySelector('.pr');
    badge.style.display=(!isNaN(w)&&max!==null&&w>max)?'inline-flex':'none';
    const out=document.getElementById('plateout-'+exId);
    if(out.classList.contains('show')) renderPlateOut(exId);
  }));
  main.querySelectorAll('.plate-btn').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.plate;
    const out=document.getElementById('plateout-'+id);
    const willShow=!out.classList.contains('show');
    out.classList.toggle('show',willShow);
    b.classList.toggle('on',willShow);
    if(willShow) renderPlateOut(id);
  }));

  const totalSets=plan.reduce((a,e)=>a+e.sets,0);
  const doneSets=plan.reduce((a,e)=>a+draft.marks[e.id].filter(Boolean).length,0);
  const btn=document.getElementById('saveBtn');
  const full=doneSets===totalSets&&totalSets>0;
  btn.classList.toggle('done',full);
  btn.textContent=full?'Finish & save workout':'Save workout';
  document.getElementById('saveSub').textContent=`${doneSets} of ${totalSets} sets ticked`;
}

function showSummary(rec){
  document.getElementById('sumTitle').textContent=rec.doneSets===rec.totalSets?'Complete':'Saved';
  document.getElementById('sumSets').textContent=`${rec.doneSets}/${rec.totalSets}`;
  const kg=rec.entries.reduce((a,e)=>{const w=parseFloat(e.weight);return a+(!isNaN(w)?w*e.reps*e.done:0);},0);
  document.getElementById('sumKg').textContent=Math.round(kg).toLocaleString('en-GB');
  document.getElementById('sumMin').textContent=rec.durationMin?`${rec.durationMin}m`:'–';
  document.getElementById('sumStreak').textContent=computeStreak();
  document.getElementById('summaryOverlay').classList.add('show');
}

async function saveWorkout(){
  ensureDraft();
  const totalSets=plan.reduce((a,e)=>a+e.sets,0);
  const doneSets=plan.reduce((a,e)=>a+draft.marks[e.id].filter(Boolean).length,0);
  if(doneSets===0){toast('Tick at least one set before you save');return;}
  const entries=plan.map(ex=>({name:ex.name,reps:ex.reps,sets:ex.sets,done:draft.marks[ex.id].filter(Boolean).length,weight:draft.weights[ex.id]||''})).filter(e=>e.done>0);
  const durationMin=draft.startedAt?Math.max(1,Math.round((Date.now()-draft.startedAt)/60000)):null;
  const note=(draft.note||'').trim();
  const idx=sessions.findIndex(s=>s.date===todayISO()&&s.shift===shift);
  const rec={id:Date.now(),date:todayISO(),shift,entries,totalSets,doneSets,durationMin,note};
  if(idx>=0)sessions[idx]=rec; else sessions.push(rec);
  await saveSessions();
  draft=null; await set(DAY_KEY,null);
  renderToday();
  syncNoteInput();
  renderStreak();
  haptic(rec.doneSets===rec.totalSets?[15,40,15,40,25]:20);
  showSummary(rec);
}

function sparklineSvg(points){
  const vals=points.map(p=>parseFloat(p.weightKg));
  const min=Math.min(...vals), max=Math.max(...vals);
  const range=(max-min)||1;
  const w=280,h=50,pad=6;
  const stepX=(w-pad*2)/((vals.length-1)||1);
  const coords=vals.map((v,i)=>`${(pad+i*stepX).toFixed(1)},${(pad+(1-(v-min)/range)*(h-pad*2)).toFixed(1)}`).join(' ');
  return `<div class="spark-wrap"><div class="spark-label">Weight trend · last ${vals.length} check-ins</div>
    <svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${coords}" fill="none" style="stroke:var(--rust-lt);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"/>
    </svg>
  </div>`;
}

function exportBackup(){
  const data={exportedAt:new Date().toISOString(),version:1,plan,sessions,bodyLog,settings};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`liftlog-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
async function importBackup(file){
  let data;
  try{ data=JSON.parse(await file.text()); }
  catch(e){ toast('Could not read that file'); return; }
  if(!data||!Array.isArray(data.plan)||!Array.isArray(data.sessions)){ toast('Not a valid backup file'); return; }
  if(!confirm('Restore will replace all current data on this device with the backup. Continue?')) return;
  plan=data.plan; sessions=data.sessions; bodyLog=Array.isArray(data.bodyLog)?data.bodyLog:[];
  settings={cycleStart:null,workOn:3,restOn:1,restTimerSec:90,...(data.settings||{})};
  await Promise.all([savePlan(),saveSessions(),saveBody(),saveSettings()]);
  calYear=null; calMonth=null;
  renderStreak();
  toast('Backup restored');
  setView(view);
}

function lifetimeTonnage(){
  let total=0;
  sessions.forEach(s=>s.entries.forEach(e=>{
    const w=parseFloat(e.weight);
    if(!isNaN(w)) total+=w*e.reps*e.done;
  }));
  return Math.round(total);
}

/* Rest-day pattern: a repeating cycle of workOn workout days then restOn rest days, anchored at cycleStart */
function dayStatus(iso){
  const hasSession=sessions.some(s=>s.date===iso);
  const isFuture=iso>todayISO();
  if(!settings.cycleStart||iso<settings.cycleStart){
    if(isFuture) return 'future';
    return hasSession?'hit':'plain';
  }
  const cycleLen=settings.workOn+settings.restOn;
  const diff=daysBetweenISO(settings.cycleStart,iso);
  const pos=((diff%cycleLen)+cycleLen)%cycleLen;
  const expectWorkout=pos<settings.workOn;
  if(isFuture) return expectWorkout?'future-work':'future';
  if(hasSession) return expectWorkout?'hit':'bonus';
  return expectWorkout?'missed':'rest-ok';
}
function statusLabel(cls){
  return ({hit:'Workout logged',bonus:'Bonus session — rest day',missed:'Missed — planned workout day',
    'rest-ok':'Rest day',plain:'',future:'',
    'future-work':'Planned workout day'})[cls]||'';
}
function monthLabel(y,m){ return new Date(Date.UTC(y,m,1)).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }

function calendarHtml(){
  if(calYear===null){
    const t=new Date(todayISO()+'T00:00:00Z');
    calYear=t.getUTCFullYear(); calMonth=t.getUTCMonth();
  }
  const first=`${calYear}-${String(calMonth+1).padStart(2,'0')}-01`;
  const daysInMonth=new Date(Date.UTC(calYear,calMonth+1,0)).getUTCDate();
  const blanks=Array.from({length:dowUTC(first)},()=>`<span class="cal-cell blank"></span>`).join('');
  let hitCount=0, expectedCount=0;
  const cellsHtml=Array.from({length:daysInMonth},(_,i)=>{
    const dayNum=i+1;
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const cls=dayStatus(iso);
    if(cls==='hit'||cls==='missed'){expectedCount++; if(cls==='hit')hitCount++;}
    const label=statusLabel(cls);
    return `<span class="cal-cell ${cls}" title="${iso}${label?' — '+label:''}">${dayNum}</span>`;
  }).join('');
  const summary=settings.cycleStart&&expectedCount>0?`<div class="cal-summary">${hitCount}/${expectedCount} workout days hit this month</div>`:'';
  return `<div class="cal-wrap">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" type="button" aria-label="Previous month">‹</button>
      <div class="cal-title">${monthLabel(calYear,calMonth)}</div>
      <button class="cal-nav" id="calNext" type="button" aria-label="Next month">›</button>
    </div>
    <div class="cal-dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal-grid">${blanks}${cellsHtml}</div>
    ${summary}
    <div class="cal-legend">
      <span class="cal-leg"><i class="cal-dot hit"></i>Hit</span>
      <span class="cal-leg"><i class="cal-dot missed"></i>Missed</span>
      <span class="cal-leg"><i class="cal-dot rest-ok"></i>Rest</span>
      <span class="cal-leg"><i class="cal-dot bonus"></i>Bonus</span>
    </div>
  </div>`;
}

  const next=document.getElementById('calNext');

  if(setup)setup.addEventListener('click',()=>{cycleEditing=true;renderHistory();});
  const edit=document.getElementById('cycleEdit');

  const cancel=document.getElementById('cs-cancel');
  if(cancel)cancel.addEventListener('click',()=>{cycleEditing=false;renderHistory();});

function sessionToText(s){
  const lines=[`Lift·Log — ${fmtDate(s.date)} (${s.shift})`];
  s.entries.forEach(e=>lines.push(`${e.name}: ${e.done}/${e.sets} sets${e.weight?` @ ${e.weight}kg`:''}`));
  if(s.durationMin) lines.push(`Duration: ${s.durationMin} min`);
  if(s.note) lines.push(`Note: ${s.note}`);
  return lines.join('\n');
}
async function shareSession(id){
  const s=sessions.find(x=>x.id===id); if(!s) return;
  const text=sessionToText(s);
  haptic(8);
  try{
    if(navigator.share){ await navigator.share({text,title:'Lift·Log workout'}); return; }
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard');
  }catch(e){
    if(!navigator.share) toast('Could not copy — try again');
  }
}

  const today=v==='today';
  document.getElementById('daterow').style.display=today?'flex':'none';
  document.getElementById('savebar').style.display=today?'block':'none';
  if(v==='today'){ renderToday(); syncNoteInput(); }
  else if(v==='plan')renderPlan(); else if(v==='history')renderHistory(); else renderBody();
  const mainEl=document.getElementById('main');
  mainEl.classList.remove('anim'); void mainEl.offsetWidth; mainEl.classList.add('anim');
}
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

document.getElementById('shift').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('on'))return;
  haptic(6);
  shift=b.dataset.s; document.querySelectorAll('#shift button').forEach(x=>x.classList.toggle('on',x===b));
  ensureDraft(); saveDraft(); renderToday();
});
document.getElementById('saveBtn').addEventListener('click',saveWorkout);
document.getElementById('summaryClose').addEventListener('click',()=>document.getElementById('summaryOverlay').classList.remove('show'));
document.getElementById('summaryOverlay').addEventListener('click',e=>{
  if(e.target.id==='summaryOverlay') e.currentTarget.classList.remove('show');
});
document.getElementById('workoutNote').addEventListener('input',e=>{
  ensureDraft(); draft.note=e.target.value; saveDraft();
});
document.getElementById('exerciseClose').addEventListener('click',()=>document.getElementById('exerciseOverlay').classList.remove('show'));
document.getElementById('exerciseOverlay').addEventListener('click',e=>{
  if(e.target.id==='exerciseOverlay') e.currentTarget.classList.remove('show');
});
document.getElementById('tabToday').addEventListener('click',()=>setView('today'));
document.getElementById('tabPlan').addEventListener('click',()=>setView('plan'));
document.getElementById('tabHist').addEventListener('click',()=>setView('history'));
document.getElementById('tabBody').addEventListener('click',()=>setView('body'));

window.addEventListener('scroll',()=>{
  document.querySelector('header').classList.toggle('scrolled',window.scrollY>4);
},{passive:true});

(async function init(){
  document.getElementById('dateLabel').textContent=fmtDate(todayISO());
  await loadAll();
  if(draft&&draft.shift)shift=draft.shift;
  document.querySelectorAll('#shift button').forEach(x=>x.classList.toggle('on',x.dataset.s===shift));
  setView('today');
  renderStreak();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
</body>
