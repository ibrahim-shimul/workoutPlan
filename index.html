<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lift Log</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1f6f4a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift·Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#13201a;--green:#1f6f4a;--green-d:#14532d;--gold:#c98a1a;
    --paper:#f3f6f3;--card:#fff;--line:#e4eae5;--muted:#6d7a72;--faint:#9aa8a0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  body{max-width:480px;margin:0 auto;padding-bottom:120px;min-height:100vh;}

  header{position:sticky;top:0;z-index:20;background:var(--paper);padding:16px 18px 10px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;justify-content:space-between;}
  .mark{font-family:'Archivo';font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--green-d);text-transform:uppercase;}
  .mark span{color:var(--gold);}
  .sub{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
  .daterow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;}
  .date{font-family:'Archivo';font-weight:700;font-size:15px;}
  .shift{display:inline-flex;background:#e7ede8;border-radius:99px;padding:3px;}
  .shift button{border:0;background:transparent;font-family:'Inter';font-weight:600;font-size:12px;color:var(--muted);padding:6px 13px;border-radius:99px;cursor:pointer;transition:.15s;}
  .shift button.on{background:var(--green);color:#fff;}

  main{padding:14px 14px 0;}

  .ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
  .ex.done{border-color:#bfe0cd;background:#f4faf6;}
  .ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .ex-name{font-family:'Archivo';font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.15;}
  .ex-meta{font-size:11.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
  .ex-idx{font-family:'Archivo';font-weight:800;font-size:13px;color:var(--green);background:#eaf3ee;min-width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ex.done .ex-idx{background:var(--green);color:#fff;}

  .wt{display:flex;align-items:center;gap:8px;margin:12px 0 13px;}
  .wt label{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;}
  .wt .field{position:relative;width:104px;}
  .wt input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:#fbfcfb;font-family:'Archivo';font-weight:700;font-size:15px;color:var(--ink);text-align:center;padding:0 30px 0 8px;font-variant-numeric:tabular-nums;outline:none;transition:.12s;}
  .wt input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(31,111,74,.12);}
  .wt .unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--faint);pointer-events:none;}
  .wt .prog{margin-left:auto;font-family:'Archivo';font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}

  .ticks{display:flex;flex-wrap:wrap;gap:9px;}
  .tick{position:relative;flex:1;min-width:60px;height:52px;border:1.5px solid var(--line);border-radius:12px;background:#fbfcfb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:.12s;user-select:none;}
  .tick .n{font-size:10px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em;}
  .tick .r{font-family:'Archivo';font-weight:700;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .tick.on{background:var(--green);border-color:var(--green);}
  .tick.on .n{color:#bfe0cd;}
  .tick.on .r{color:#fff;}

  .savebar{position:fixed;left:0;right:0;bottom:56px;max-width:480px;margin:0 auto;padding:10px 14px 12px;background:linear-gradient(to top,var(--paper) 74%,transparent);}
  .save{width:100%;height:52px;border:0;border-radius:14px;background:var(--green);color:#fff;font-family:'Archivo';font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;}
  .save:active{transform:scale(.985);}
  .save.done{background:var(--gold);}
  .save-sub{text-align:center;font-size:11px;color:var(--faint);margin-top:6px;font-weight:500;}

  .tabs{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;height:56px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;}
  .tabs button{flex:1;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:'Inter';font-weight:600;font-size:11px;color:var(--faint);}
  .tabs button.on{color:var(--green);}
  .tabs svg{width:22px;height:22px;stroke-width:2;fill:none;stroke:currentColor;}

  h2.view-title{font-family:'Archivo';font-weight:700;font-size:20px;padding:2px 4px 4px;}
  .view-note{font-size:12px;color:var(--muted);padding:0 4px 14px;line-height:1.45;}

  .plan-ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
  .plan-ex .pn{flex:1;min-width:0;}
  .plan-ex .pname{font-family:'Archivo';font-weight:700;font-size:15px;line-height:1.15;}
  .plan-ex .pmeta{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500;}
  .icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fbfcfb;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;}
  .icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;}
  .icon-btn.del{color:#b4453b;border-color:#f0d9d6;background:#fdf5f4;}
  .add-btn{width:100%;height:48px;border:1.5px dashed #bcd3c4;border-radius:13px;background:transparent;color:var(--green-d);font-family:'Archivo';font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:10px;}

  .form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .form h3{font-family:'Archivo';font-weight:700;font-size:15px;margin-bottom:12px;}
  .frow{margin-bottom:11px;}
  .frow label{display:block;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .frow input{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:#fbfcfb;font-family:'Inter';font-weight:500;font-size:15px;color:var(--ink);padding:0 12px;outline:none;transition:.12s;}
  .frow input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(31,111,74,.12);}
  .frow.num input{font-family:'Archivo';font-weight:700;text-align:center;font-variant-numeric:tabular-nums;}
  .fgrid{display:flex;gap:10px;}
  .fgrid .frow{flex:1;}
  .fbtns{display:flex;gap:9px;margin-top:4px;}
  .fbtns button{flex:1;height:46px;border-radius:11px;font-family:'Archivo';font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);}
  .fbtns .primary{background:var(--green);border-color:var(--green);color:#fff;}

  .hist-day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;}
  .hist-top{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;}
  .hist-date{font-family:'Archivo';font-weight:700;font-size:15px;}
  .hist-meta{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:500;}
  .pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:99px;flex-shrink:0;}
  .pill.m{background:#fef4dc;color:#a9760f;}.pill.e{background:#e7edfb;color:#3a55a5;}
  .hist-body{padding:0 15px 12px;display:none;}
  .hist-body.open{display:block;}
  .hrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px;gap:10px;}
  .hrow .hn{font-weight:500;}
  .hrow .hv{font-family:'Archivo';font-weight:600;color:var(--green-d);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}

  .empty{text-align:center;padding:52px 24px;color:var(--muted);}
  .empty .big{font-family:'Archivo';font-weight:700;font-size:17px;color:var(--ink);margin-bottom:6px;}
  .empty p{font-size:13px;line-height:1.5;}

  .toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark">Lift<span>·</span>Log</div>
    <div class="sub">Tap sets as you go</div>
  </div>
  <div class="daterow" id="daterow">
    <div class="date" id="dateLabel">—</div>
    <div class="shift" id="shift">
      <button data-s="morning" class="on">Morning</button>
      <button data-s="evening">Evening</button>
    </div>
  </div>
</header>

<main id="main"></main>

<div class="savebar" id="savebar">
  <button class="save" id="saveBtn">Save workout</button>
  <div class="save-sub" id="saveSub"></div>
</div>

<nav class="tabs">
  <button id="tabToday" class="on">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    Today
  </button>
  <button id="tabPlan">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    Plan
  </button>
  <button id="tabHist">
    <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2M3.05 11a9 9 0 116 9.5"/><path d="M3 4v4h4"/></svg>
    History
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const PLAN_KEY='liftlog:plan';
const SESS_KEY='liftlog:sessions';
const DAY_KEY='liftlog:draft';

const DEFAULT_PLAN=[
  {id:'bench',name:'Flat Machine Bench Press',sets:4,reps:12,weight:''},
  {id:'pullup',name:'Assisted Pull-up',sets:4,reps:12,weight:''},
  {id:'shoulder',name:'Machine Shoulder Press',sets:4,reps:12,weight:''},
  {id:'curl',name:'Dumbbell Curl',sets:4,reps:12,weight:''},
  {id:'tricep',name:'Tricep Press Down',sets:4,reps:12,weight:''},
  {id:'squat',name:'Free Squats',sets:4,reps:12,weight:''},
];

let plan=[], sessions=[], draft=null;
let shift='morning', view='today', editingId=null, adding=false;

const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

async function get(k,fb){
  try{
    const raw=localStorage.getItem(k);
    return raw!==null?JSON.parse(raw):fb;
  }catch(e){return fb;}
}
async function set(k,v){
  try{
    if(v===null||v===undefined){localStorage.removeItem(k);return;}
    localStorage.setItem(k,JSON.stringify(v));
  }catch(e){}
}

async function loadAll(){
  plan=await get(PLAN_KEY, DEFAULT_PLAN.map(x=>({...x})));
  sessions=await get(SESS_KEY, []);
  draft=await get(DAY_KEY, null);
  if(!draft || draft.date!==todayISO()) draft=null;
}
const savePlan=()=>set(PLAN_KEY,plan);
const saveSessions=()=>set(SESS_KEY,sessions);
const saveDraft=()=>set(DAY_KEY,draft);

function ensureDraft(){
  if(!draft || draft.date!==todayISO()) draft={date:todayISO(),shift,marks:{},weights:{}};
  draft.shift=shift;
  plan.forEach(ex=>{
    if(!draft.marks[ex.id]) draft.marks[ex.id]=Array.from({length:ex.sets},()=>false);
    else if(draft.marks[ex.id].length!==ex.sets){
      const old=draft.marks[ex.id]; draft.marks[ex.id]=Array.from({length:ex.sets},(_,i)=>old[i]||false);
    }
    if(draft.weights[ex.id]===undefined) draft.weights[ex.id]=ex.weight||'';
  });
}

function renderToday(){
  ensureDraft();
  const main=document.getElementById('main');
  if(!plan.length){
    main.innerHTML=`<div class="empty"><div class="big">No exercises yet</div><p>Add your workouts in the Plan tab first, then come back here to log them.</p></div>`;
    document.getElementById('saveSub').textContent=''; return;
  }
  main.innerHTML=plan.map((ex,i)=>{
    const marks=draft.marks[ex.id];
    const doneCount=marks.filter(Boolean).length;
    const allDone=doneCount===ex.sets;
    const ticks=marks.map((on,si)=>`<div class="tick ${on?'on':''}" data-ex="${ex.id}" data-si="${si}"><span class="n">Set ${si+1}</span><span class="r">${ex.reps}</span></div>`).join('');
    return `<div class="ex ${allDone?'done':''}">
      <div class="ex-head">
        <div><div class="ex-name">${ex.name}</div><div class="ex-meta">${ex.sets} sets × ${ex.reps} reps</div></div>
        <div class="ex-idx">${allDone?'✓':i+1}</div>
      </div>
      <div class="wt">
        <label>Weight</label>
        <span class="field"><input inputmode="decimal" data-wex="${ex.id}" value="${draft.weights[ex.id]||''}" placeholder="–"><span class="unit">kg</span></span>
        <span class="prog">${doneCount}/${ex.sets}</span>
      </div>
      <div class="ticks">${ticks}</div>
    </div>`;
  }).join('');

  main.querySelectorAll('.tick').forEach(t=>t.addEventListener('click',()=>{
    const ex=t.dataset.ex, si=+t.dataset.si;
    draft.marks[ex][si]=!draft.marks[ex][si]; saveDraft(); renderToday();
  }));
  main.querySelectorAll('input[data-wex]').forEach(inp=>inp.addEventListener('input',()=>{
    draft.weights[inp.dataset.wex]=inp.value.trim(); saveDraft();
    const card=inp.closest('.ex'); /* keep focus, no rerender */
  }));

  const totalSets=plan.reduce((a,e)=>a+e.sets,0);
  const doneSets=plan.reduce((a,e)=>a+draft.marks[e.id].filter(Boolean).length,0);
  const btn=document.getElementById('saveBtn');
  const full=doneSets===totalSets&&totalSets>0;
  btn.classList.toggle('done',full);
  btn.textContent=full?'Finish & save workout':'Save workout';
  document.getElementById('saveSub').textContent=`${doneSets} of ${totalSets} sets ticked`;
}

async function saveWorkout(){
  ensureDraft();
  const totalSets=plan.reduce((a,e)=>a+e.sets,0);
  const doneSets=plan.reduce((a,e)=>a+draft.marks[e.id].filter(Boolean).length,0);
  if(doneSets===0){toast('Tick at least one set first');return;}
  const entries=plan.map(ex=>({name:ex.name,reps:ex.reps,sets:ex.sets,done:draft.marks[ex.id].filter(Boolean).length,weight:draft.weights[ex.id]||''})).filter(e=>e.done>0);
  const idx=sessions.findIndex(s=>s.date===todayISO()&&s.shift===shift);
  const rec={id:Date.now(),date:todayISO(),shift,entries,totalSets,doneSets};
  if(idx>=0)sessions[idx]=rec; else sessions.push(rec);
  await saveSessions();
  draft=null; await set(DAY_KEY,null);
  toast(doneSets===totalSets?'Workout complete — saved':'Workout saved');
  renderToday();
}

function renderPlan(){
  const main=document.getElementById('main');
  let html=`<h2 class="view-title">Your plan</h2><p class="view-note">Set each exercise once — name, sets, reps, and a default weight. The Today tab turns every set into a tick box.</p>`;
  if(adding||editingId){
    const ex=editingId?plan.find(p=>p.id===editingId):{name:'',sets:4,reps:12,weight:''};
    html+=`<div class="form">
      <h3>${editingId?'Edit exercise':'New exercise'}</h3>
      <div class="frow"><label>Exercise name</label><input id="f-name" value="${ex.name||''}" placeholder="Lat Pulldown"></div>
      <div class="fgrid">
        <div class="frow num"><label>Sets</label><input id="f-sets" inputmode="numeric" value="${ex.sets||''}" placeholder="4"></div>
        <div class="frow num"><label>Reps</label><input id="f-reps" inputmode="numeric" value="${ex.reps||''}" placeholder="12"></div>
        <div class="frow num"><label>Weight kg</label><input id="f-weight" inputmode="decimal" value="${ex.weight||''}" placeholder="–"></div>
      </div>
      <div class="fbtns"><button id="f-cancel">Cancel</button><button id="f-save" class="primary">${editingId?'Save changes':'Add exercise'}</button></div>
    </div>`;
  } else {
    html+=`<button class="add-btn" id="addEx"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Add exercise</button>`;
  }
  html+=plan.map(ex=>`<div class="plan-ex">
      <div class="pn"><div class="pname">${ex.name}</div><div class="pmeta">${ex.sets} sets × ${ex.reps} reps${ex.weight?` · ${ex.weight} kg`:''}</div></div>
      <button class="icon-btn" data-edit="${ex.id}"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="icon-btn del" data-del="${ex.id}"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
    </div>`).join('');
  main.innerHTML=html;

  const add=document.getElementById('addEx');
  if(add)add.addEventListener('click',()=>{adding=true;editingId=null;renderPlan();});
  main.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{editingId=b.dataset.edit;adding=false;renderPlan();window.scrollTo({top:0,behavior:'smooth'});}));
  main.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    if(plan.length<=1){toast('Keep at least one exercise');return;}
    plan=plan.filter(p=>p.id!==b.dataset.del); await savePlan(); renderPlan();
  }));
  const cancel=document.getElementById('f-cancel');
  if(cancel)cancel.addEventListener('click',()=>{adding=false;editingId=null;renderPlan();});
  const fsave=document.getElementById('f-save');
  if(fsave)fsave.addEventListener('click',async()=>{
    const name=document.getElementById('f-name').value.trim();
    const sets=parseInt(document.getElementById('f-sets').value)||0;
    const reps=parseInt(document.getElementById('f-reps').value)||0;
    const weight=document.getElementById('f-weight').value.trim();
    if(!name){toast('Add a name');return;}
    if(sets<1||reps<1){toast('Sets and reps must be at least 1');return;}
    if(sets>12){toast('Max 12 sets');return;}
    if(editingId){const ex=plan.find(p=>p.id===editingId);ex.name=name;ex.sets=sets;ex.reps=reps;ex.weight=weight;}
    else plan.push({id:'x'+Date.now(),name,sets,reps,weight});
    await savePlan(); adding=false; editingId=null; renderPlan();
  });
}

function renderHistory(){
  const main=document.getElementById('main');
  if(!sessions.length){
    main.innerHTML=`<h2 class="view-title">History</h2><div class="empty"><div class="big">No sessions saved</div><p>Finish a workout in the Today tab and it lands here — every session, with the sets you completed and the weight you used.</p></div>`;
    return;
  }
  const sorted=[...sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  main.innerHTML=`<h2 class="view-title">History</h2>`+sorted.map(s=>{
    const rows=s.entries.map(e=>`<div class="hrow"><span class="hn">${e.name}</span><span class="hv">${e.done}/${e.sets} sets${e.weight?` · ${e.weight}kg`:''}</span></div>`).join('');
    return `<div class="hist-day">
      <div class="hist-top" data-id="${s.id}">
        <div><div class="hist-date">${fmtDate(s.date)}</div><div class="hist-meta">${s.doneSets}/${s.totalSets} sets · ${s.entries.length} exercises</div></div>
        <span class="pill ${s.shift==='morning'?'m':'e'}">${s.shift}</span>
      </div>
      <div class="hist-body" id="hb-${s.id}">${rows}</div>
    </div>`;
  }).join('');
  main.querySelectorAll('.hist-top').forEach(t=>t.addEventListener('click',()=>document.getElementById('hb-'+t.dataset.id).classList.toggle('open')));
}

function setView(v){
  view=v; adding=false; editingId=null;
  document.getElementById('tabToday').classList.toggle('on',v==='today');
  document.getElementById('tabPlan').classList.toggle('on',v==='plan');
  document.getElementById('tabHist').classList.toggle('on',v==='history');
  const today=v==='today';
  document.getElementById('daterow').style.display=today?'flex':'none';
  document.getElementById('savebar').style.display=today?'block':'none';
  if(v==='today')renderToday(); else if(v==='plan')renderPlan(); else renderHistory();
}
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

document.getElementById('shift').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  shift=b.dataset.s; document.querySelectorAll('#shift button').forEach(x=>x.classList.toggle('on',x===b));
  ensureDraft(); saveDraft(); renderToday();
});
document.getElementById('saveBtn').addEventListener('click',saveWorkout);
document.getElementById('tabToday').addEventListener('click',()=>setView('today'));
document.getElementById('tabPlan').addEventListener('click',()=>setView('plan'));
document.getElementById('tabHist').addEventListener('click',()=>setView('history'));

(async function init(){
  document.getElementById('dateLabel').textContent=fmtDate(todayISO());
  await loadAll();
  if(draft&&draft.shift)shift=draft.shift;
  document.querySelectorAll('#shift button').forEach(x=>x.classList.toggle('on',x.dataset.s===shift));
  setView('today');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
